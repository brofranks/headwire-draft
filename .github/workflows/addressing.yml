name: Integrated addressing
on:
  push:
    branches: [rehearsal-addressing]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
      - name: Prepare integrated source
        run: |
          mkdir fork && tar -xzf fork.tar.gz -C fork
          go mod edit -replace=tailscale.com=./fork
          go install github.com/tailscale/tailcat/cmd/tailcat@52fbad323e9d352f1febb623e0975368e9a8cbdd
      - name: Exercise Wintun
        run: |
          source scripts/goflags.sh
          read -r url digest < <(go run ./scripts/wintun)
          curl -fsSL "$url" -o wintun.zip
          echo "$digest  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          go test -c -o rehearsal/engine.test.exe ./internal/engine
          cp wintun/bin/amd64/wintun.dll rehearsal/
          rehearsal/engine.test.exe -test.v -test.run '^TestRehearsalWintunSubnet$' -test.timeout 3m
      - name: Verify shipped route regression
        run: |
          source scripts/goflags.sh
          go mod edit -dropreplace=tailscale.com
          go mod edit -replace=tailscale.com=github.com/brofranks/tailscale@v1.104.7-headwire.3
          go test -c -o rehearsal/shipped.test.exe ./internal/engine
          if rehearsal/shipped.test.exe -test.v -test.run '^TestRehearsalWintunSubnet$' -test.timeout 3m > shipped.log 2>&1; then
            echo "shipped fork unexpectedly retained the subnet route"
            exit 1
          fi
          grep 'requested route missing' shipped.log
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.4
      - name: Build provider with integrated fork
        run: |
          mkdir fork && tar -xzf fork.tar.gz -C fork
          go mod edit -replace=tailscale.com=./fork
          go install github.com/tailscale/tailcat/cmd/tailcat@52fbad323e9d352f1febb623e0975368e9a8cbdd
          source scripts/goflags.sh
          export GOOS=android GOARCH=amd64 CGO_ENABLED=1
          export CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          go test -c -o rehearsal/provider.test ./internal/provider
          printf 'package netmon\n' > "$RUNNER_TEMP/empty.go"
          python3 -c 'import json,os; print(json.dumps({"Replace":{os.path.abspath("fork/net/netmon/interfaces_linux_test.go"):os.environ["RUNNER_TEMP"]+"/empty.go"}}))' > "$RUNNER_TEMP/android-overlay.json"
          (cd fork && go test -overlay "$RUNNER_TEMP/android-overlay.json" -c -o ../rehearsal/netmon.test ./net/netmon)
      - name: Boot emulator and run as app UID
        run: bash rehearsal/android.sh
